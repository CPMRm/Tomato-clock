<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖書館專用蕃茄鐘</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d3557">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.2rem;
    }
    .tab-btn {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
      color: #555;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background-color: #e63946;
      color: white;
      border-color: #e63946;
      font-weight: bold;
    }
    .preset-group {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .preset-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .preset-btn.active {
      border-color: #1d3557;
      background-color: #eef2f7;
      color: #1d3557;
      font-weight: bold;
    }
    .custom-input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .custom-input-group input {
      width: 60px;
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
    }
    .timer {
      font-size: 4rem;
      font-weight: bold;
      margin: 0.5rem 0;
      color: #e63946;
    }
    .control-btns button {
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #1d3557;
      color: white;
      cursor: pointer;
      margin: 0.2rem;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      padding: 0.5rem;
      border-radius: 6px;
    }
    .status.safe { background-color: #d4edda; color: #155724; }
    .status.warn { background-color: #f8d7da; color: #721c24; }
    select {
      width: 100%;
      padding: 0.5rem;
      margin-top: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>圖書館專用蕃茄鐘 🍅</h2>

  <!-- 模式切換：專注 vs 休息 -->
  <div class="mode-tabs">
    <button class="tab-btn active" id="workTab">🍅 專注模式</button>
    <button class="tab-btn" id="breakTab">☕ 休息模式</button>
  </div>

  <!-- 時間預設按鈕 -->
  <div class="preset-group" id="presetGroup">
    <button class="preset-btn active" data-time="25">25 分鐘</button>
    <button class="preset-btn" data-time="50">50 分鐘</button>
    <button class="preset-btn" data-time="custom">自訂</button>
  </div>

  <!-- 自訂時間輸入框 (預設隱藏) -->
  <div class="custom-input-group" id="customInputContainer" style="display: none;">
    <label for="customMinutes">設定分鐘數：</label>
    <input type="number" id="customMinutes" min="1" max="120" value="30">
    <button class="preset-btn" id="applyCustomBtn">套用</button>
  </div>

  <!-- 時間顯示 -->
  <div class="timer" id="timerDisplay">25:00</div>

  <!-- 控制按鈕 -->
  <div class="control-btns">
    <button id="startBtn">開始專注</button>
    <button id="resetBtn">重置</button>
  </div>

  <!-- 音訊輸出選擇器 -->
  <select id="audioOutputSelect">
    <option value="">正在載入音訊設備...</option>
  </select>

  <!-- 安全防護狀態標籤 -->
  <div id="statusBox" class="status warn">
    ⚠️ 未偵測到耳機，請選擇耳機輸出
  </div>
</div>

<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script>
  // 當前狀態
  let currentMode = 'work'; // 'work' 或 'break'
  let currentDuration = 25 * 60; // 預設 25 分鐘
  let remainingTime = currentDuration;
  let isRunning = false;
  let timerWorker = null;

  // 預設選項時間 (分鐘)
  const presets = {
    work: [25, 50],
    break: [5, 15]
  };

  // DOM 元素
  const workTab = document.getElementById('workTab');
  const breakTab = document.getElementById('breakTab');
  const presetGroup = document.getElementById('presetGroup');
  const customInputContainer = document.getElementById('customInputContainer');
  const customMinutesInput = document.getElementById('customMinutes');
  const applyCustomBtn = document.getElementById('applyCustomBtn');
  const timerDisplay = document.getElementById('timerDisplay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const audioOutputSelect = document.getElementById('audioOutputSelect');
  const statusBox = document.getElementById('statusBox');
  const alarmSound = document.getElementById('alarmSound');

  // 1. 初始化 Web Worker
  function initWorker() {
    if (window.Worker) {
      timerWorker = new Worker('timer-worker.js');
      
      timerWorker.onmessage = function (e) {
        const { type, remaining } = e.data;
        if (type === 'tick') {
          remainingTime = remaining;
          updateDisplay(remainingTime);
        } else if (type === 'finished') {
          isRunning = false;
          updateDisplay(0);
          playAlarmSafely();
          handleTimerFinished();
        }
      };
    }
  }

  // 2. 計時完成後的自動切換邏輯
  function handleTimerFinished() {
    if (currentMode === 'work') {
      alert("🎉 專注時間結束！準備進入休息模式。");
      switchMode('break');
    } else {
      alert("⚡ 休息結束！準備開始下一輪專注。");
      switchMode('work');
    }
  }

  // 3. 切換專注 / 休息模式
  function switchMode(mode) {
    stopTimer();
    currentMode = mode;

    if (mode === 'work') {
      workTab.classList.add('active');
      breakTab.classList.remove('active');
      startBtn.textContent = '開始專注';
      timerDisplay.style.color = '#e63946'; // 專注顏色：紅色
    } else {
      breakTab.classList.add('active');
      workTab.classList.remove('active');
      startBtn.textContent = '開始休息';
      timerDisplay.style.color = '#2a9d8f'; // 休息顏色：綠色
    }

    renderPresets();
  }

  // 4. 渲染預設時間按鈕
  function renderPresets() {
    const list = presets[currentMode];
    presetGroup.innerHTML = '';

    list.forEach((mins, index) => {
      const btn = document.createElement('button');
      btn.className = `preset-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = `${mins} 分鐘`;
      btn.dataset.time = mins;
      btn.addEventListener('click', () => selectPreset(mins, btn));
      presetGroup.appendChild(btn);
    });

    // 加入「自訂」按鈕
    const customBtn = document.createElement('button');
    customBtn.className = 'preset-btn';
    customBtn.textContent = '自訂';
    customBtn.dataset.time = 'custom';
    customBtn.addEventListener('click', () => selectPreset('custom', customBtn));
    presetGroup.appendChild(customBtn);

    // 預設選取第一個
    selectPreset(list[0], presetGroup.children[0]);
  }

  // 5. 選取時間預設
  function selectPreset(mins, btnElement) {
    stopTimer();

    // 更新按鈕樣式
    Array.from(presetGroup.children).forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');

    if (mins === 'custom') {
      customInputContainer.style.display = 'flex';
      setDuration(parseInt(customMinutesInput.value, 10) || 10);
    } else {
      customInputContainer.style.display = 'none';
      setDuration(mins);
    }
  }

  function setDuration(minutes) {
    currentDuration = minutes * 60;
    remainingTime = currentDuration;
    updateDisplay(remainingTime);
  }

  // 6. 停止 / 重置計時器
  function stopTimer() {
    if (timerWorker) timerWorker.postMessage({ command: 'stop' });
    isRunning = false;
    startBtn.textContent = currentMode === 'work' ? '開始專注' : '開始休息';
  }

  // 7. 時間顯示更新
  function updateDisplay(seconds) {
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${mins}:${secs}`;
    const modeLabel = currentMode === 'work' ? '🍅 專注中' : '☕ 休息中';
    document.title = `(${mins}:${secs}) ${modeLabel} - 圖書館蕃茄鐘`;
  }

  // 8. 偵測與選擇耳機
  async function getAudioOutputs() {
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {});
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

      audioOutputSelect.innerHTML = '';
      let hasHeadphone = false;

      audioOutputs.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        const label = device.label || `輸出設備 ${index + 1}`;
        option.text = label;

        if (label.toLowerCase().includes('headphone') || 
            label.toLowerCase().includes('bluetooth') || 
            label.toLowerCase().includes('耳機') || 
            label.toLowerCase().includes('airpods')) {
          hasHeadphone = true;
          option.selected = true;
        }
        audioOutputSelect.appendChild(option);
      });

      updateStatus(hasHeadphone);
    } catch (err) {
      statusBox.textContent = "無法偵測音訊設備";
    }
  }

  function updateStatus(isHeadphone) {
    if (isHeadphone) {
      statusBox.className = "status safe";
      statusBox.textContent = "🛡️ 已連接耳機，可安全提醒";
    } else {
      statusBox.className = "status warn";
      statusBox.textContent = "⚠️ 當前使用揚聲器，時間到將自動改為靜音提醒";
    }
  }

  // 9. 響鈴保護邏輯
  async function playAlarmSafely() {
    const selectedDeviceId = audioOutputSelect.value;
    const selectedText = audioOutputSelect.options[audioOutputSelect.selectedIndex]?.text || '';
    
    const isHeadphone = selectedText.toLowerCase().includes('headphone') || 
                        selectedText.toLowerCase().includes('bluetooth') || 
                        selectedText.toLowerCase().includes('耳機') || 
                        selectedText.toLowerCase().includes('airpods');

    if (isHeadphone && typeof alarmSound.setSinkId === 'function') {
      try {
        await alarmSound.setSinkId(selectedDeviceId);
        alarmSound.play();
      } catch (e) {
        fallbackVisualNotice();
      }
    } else {
      fallbackVisualNotice();
    }
  }

  function fallbackVisualNotice() {
    console.log("為保護圖書館安靜環境，改為視覺/系統彈窗提醒");
  }

  // 10. 事件綁定
  workTab.addEventListener('click', () => switchMode('work'));
  breakTab.addEventListener('click', () => switchMode('break'));

  applyCustomBtn.addEventListener('click', () => {
    const val = parseInt(customMinutesInput.value, 10);
    if (val > 0) setDuration(val);
  });

  startBtn.addEventListener('click', () => {
    alarmSound.load(); // 預先解鎖音訊權限

    if (isRunning) {
      timerWorker.postMessage({ command: 'stop' });
      isRunning = false;
      startBtn.textContent = '繼續';
    } else {
      timerWorker.postMessage({ command: 'start', duration: remainingTime });
      isRunning = true;
      startBtn.textContent = '暫停';
    }
  });

  resetBtn.addEventListener('click', () => {
    stopTimer();
    remainingTime = currentDuration;
    updateDisplay(remainingTime);
  });

  // 11. PWA Service Worker 註冊
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker 註冊成功'))
        .catch(err => console.log('Service Worker 註冊失敗', err));
    });
  }

  navigator.mediaDevices.addEventListener('devicechange', getAudioOutputs);

  // 初始化
  initWorker();
  renderPresets();
  getAudioOutputs();
</script>

</body>
</html>
